<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Entrada de Vehículos</title>
    <link rel="stylesheet" type="text/css" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script>
        function mostrarVehiculosRegistrados() {
            fetch('/api/obtener-entradas')
                .then(response => response.json())
                .then(data => {
                    const listaVehiculos = document.getElementById('listaVehiculos');
                    listaVehiculos.innerHTML = '';
                    data.forEach(entrada => {
                        const li = document.createElement('li');
                        li.className = 'list-group-item';
                        let contenido = `Placa: ${entrada.placa} - Hora de Entrada: ${new Date(entrada.hora_entrada).toLocaleString()}`;
                        if (entrada.editado) {
                            contenido += ' - <span style="color: red;">Esta placa ha sido editada</span>';
                        }
                        if ('time_spent' in entrada) {
                            contenido += ` - Tiempo en estacionamiento: ${entrada.time_spent.toFixed(2)} minutos`;
                        }
                        if ('tarifa' in entrada) {
                            contenido += ` - Tarifa: ${entrada.tarifa.toFixed(2)} COP`;
                        }
                        li.innerHTML = contenido;

                        const botonEditar = document.createElement('button');
                        botonEditar.className = 'btn btn-warning btn-sm ms-2';
                        botonEditar.textContent = 'Editar Placa';
                        botonEditar.onclick = () => abrirModalEditar(entrada.placa);
                        li.appendChild(botonEditar);

                        const botonVerFoto = document.createElement('a');
                        botonVerFoto.className = 'btn btn-info btn-sm ms-2';
                        botonVerFoto.textContent = 'Ver Foto';
                        botonVerFoto.href = entrada.public_url; // Cambio de firebase_url a public_url
                        botonVerFoto.target = '_blank'; // Abrir enlace en una nueva pestaña
                        li.appendChild(botonVerFoto);

                        listaVehiculos.appendChild(li);
                    });
                })
                .catch(error => console.error('Error al obtener las entradas:', error));
        }

        function abrirModalEditar(placaOriginal) {
            const inputPlacaOriginal = document.getElementById('placaOriginal');
            const inputNuevaPlaca = document.getElementById('nuevaPlaca');
            inputPlacaOriginal.value = placaOriginal;
            inputNuevaPlaca.value = '';
            const editarPlacaModal = new bootstrap.Modal(document.getElementById('editarPlacaModal'));
            editarPlacaModal.show();
        }

        function actualizarPlaca() {
            const placaOriginal = document.getElementById('placaOriginal').value;
            const nuevaPlaca = document.getElementById('nuevaPlaca').value;
        
            fetch('/api/actualizar-placa', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    placa_original: placaOriginal,
                    nueva_placa: nuevaPlaca
                })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);  // Mostrar mensaje de éxito o error
                $('#editarPlacaModal').modal('hide');  // Cerrar modal
                mostrarVehiculosRegistrados();  // Actualizar lista de vehículos
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">Registro de Entrada de Vehículos</h1>
        <div>
            <button class="btn btn-primary" onclick="mostrarVehiculosRegistrados()">Actualizar Lista de Entradas</button>
        </div>
        <div class="mt-4">
            <h2 class="text-center">Vehículos Registrados</h2>
            <ul id="listaVehiculos" class="list-group"></ul>
        </div>
    </div>
    <div class="modal fade" id="editarPlacaModal" tabindex="-1" aria-labelledby="editarPlacaModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editarPlacaModalLabel">Editar Placa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="placaOriginal" class="form-control mb-2" readonly>
                    <input type="text" id="nuevaPlaca" class="form-control" placeholder="Nueva Placa">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="actualizarPlaca()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
